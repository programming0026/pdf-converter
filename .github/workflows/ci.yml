name: CI

# Compila y ejecuta las pruebas en cada push a main, en los pull requests y a mano.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (sbj-pdf)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sbj-pdf
    steps:
      - uses: actions/checkout@v5
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sbj-pdf/pom.xml
      - name: Compilar y ejecutar las pruebas
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (react-pdf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-pdf
    steps:
      - uses: actions/checkout@v5
      - name: Node 26
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: react-pdf/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Compilar
        run: npm run build

  docker:
    name: Imágenes de Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Construir las imágenes del docker-compose.yml
        run: docker compose build
