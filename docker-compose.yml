services:
  backend:
    build:
      context: ./sbj-pdf
      dockerfile: Dockerfile
    container_name: pdf-studio-backend
    ports:
      - "9097:9097"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9097/api/management/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./react-pdf
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:9097/api/pdf}
    container_name: pdf-studio-frontend
    ports:
      - "3003:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
