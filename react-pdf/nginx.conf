server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Endpoint de salud para el healthcheck de Docker
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
